name: PR Validator

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        command: "--replSet rs0 --bind_ip_all"
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Init replica set
        run: |
          docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval 'rs.initiate({_id:"rs0", members:[{_id:0, host:"localhost:27017"}]})'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Label PR by size
        uses: pascalgn/size-label-action@v0.4.3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: "mongodb://localhost:27017/orderdb?replicaSet=rs0"
          JWT_ACCESS_SECRET: "pr-validator-test-secret-key-must-be-at-least-32-chars-long"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
