services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet --port 27017
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: mongodb://mongo:27017/orderdb

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    env_file:
      - .env

volumes:
  mongo_data:
