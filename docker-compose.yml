services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet --port 27017
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo

  mongo-express:
    image: mongo-express:1
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    env_file:
      - .env

volumes:
  mongo_data:
